<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethereal Prince - Spiritual Wellness & Guidance</title>
    <link rel="shortcut icon" href="assets/imgfavicon.ico">
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
    <link rel="img_src" href="assets/img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
    <link rel="manifest" href="assets/img/site.webmanifest">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="assets/css/site_min.css">
</head>

<body>
    <div id="menu-overlay"></div>
    <div id="main-content">
        <header id="main-header" class="header">
            <div class="container header-content">
                <!-- Mobile Controls -->
                <div class="header-controls">
                    <button id="theme-toggle" type="button" class="theme-toggle-btn" title="Toggle dark mode">
                        <svg id="sun-icon" class="theme-icon" xmlns="http://www.w3.org/2000/svg" fill="none"
                             viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                        </svg>
                        <svg id="moon-icon" class="theme-icon" xmlns="http://www.w3.org/2000/svg" fill="none"
                             viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                        </svg>
                    </button>
                </div>
                <!-- Centered Content -->
                <a href="#" class="header-brand">
                    <img src="assets/img/ep_logo.svg" alt="Ethereal Prince Logo" class="header-logo">
                    <span class="brand-name">Ethereal Prince</span>
                </a>
                <nav class="main-nav">
                    <div class="desktop-nav">
                    </div>
                </nav>
            </div>
        </header>
        <nav id="mobile-nav" class="mobile-nav">
        </nav>
        <main>
            <section class="hero-section">
                <div class="container">
                    <h2 class="hero-title brand-name">Coming Soon</h2>
                </div>
            </section>
        </main>
        <footer class="footer">
            <div class="container">
                <img src="assets/img/ep_footer.svg" alt="Ethereal Prince Logo"
                     class="footer-logo">
                <p style="margin-top: 0.5rem;">&copy; 2025 Ethereal Prince. All Rights Reserved.</p>
            </div>
        </footer>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // --- Theme Toggler ---
            const themeToggleBtn = document.getElementById("theme-toggle");
            const prefersDark = window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;
            const storedTheme = localStorage.getItem("theme");

            if (storedTheme === "dark" || (!storedTheme && prefersDark)) {
                document.body.classList.add("dark");
            }

            themeToggleBtn.addEventListener("click", () => {
                document.body.classList.toggle("dark");
                localStorage.setItem(
                    "theme",
                    document.body.classList.contains("dark") ? "dark" : "light"
                );
            });
        });

    </script>
</body>

</html>
